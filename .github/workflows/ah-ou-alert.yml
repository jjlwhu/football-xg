name: 皇冠盘口预警

on:
  workflow_dispatch:
    inputs:
      mode:
        description: morning=当日通扫 overnight=夜间9小时 hour=未来1.5小时
        default: auto
        type: choice
        options: [auto, morning, overnight, hour]

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      INFERSPORTS_API_KEY: ${{ secrets.INFERSPORTS_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: mkdir -p output
      - run: python -m src.alert_today --mode ${{ github.event.inputs.mode || 'auto' }}
