name: 皇冠盘口预警

on:
  schedule:
    # 公开仓库后重注册定时。UTC 每小时 :10；脚本按欧洲时间判断是否休息。
    - cron: "10 * * * *"
    - cron: "30 6,7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: morning=当日通扫 overnight=夜间9小时 hour=未来1.5小时
        default: auto
        type: choice
        options: [auto, morning, overnight, hour]

jobs:
  alert:
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Paris
      INFERSPORTS_API_KEY: ${{ secrets.INFERSPORTS_API_KEY }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: 准备状态文件
        run: mkdir -p output && test -f output/alert_state.json || echo '{}' > output/alert_state.json
      - name: 恢复去重状态
        uses: actions/cache@v5
        with:
          path: output/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-
      - name: 判断时段
        id: gate
        run: echo "mode=$(python -m src.alert_today --print-mode --mode '${{ github.event.inputs.mode || 'auto' }}')" >> "$GITHUB_OUTPUT"
      - name: 扫描并邮件
        if: steps.gate.outputs.mode != 'rest'
        run: python -m src.alert_today --mode ${{ steps.gate.outputs.mode }}
